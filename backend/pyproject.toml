[project]
name = "aje"
version = "0.1.0"
description = "Agentic Job search Engine — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "sqlite-vec>=0.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "langchain-core>=0.3",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "langgraph>=0.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-jobspy>=1.1.82",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
providers = [
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fpdf2>=2.7",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aje"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
