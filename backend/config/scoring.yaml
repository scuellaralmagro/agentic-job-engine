# Weights must sum to 1.0 — validated at load.
weights:
  skills: 0.5
  seniority: 0.2
  domain: 0.2
  language: 0.1

prefilter:
  # Conservative default. Replace with a value taken from
  # `uv run python -m scripts.calibrate_threshold` once you have real offers.
  min_similarity: 0.30
  top_k: 8
  chunk_chars: 800

queue:
  threshold: 60

estimate:
  # gpt-5.6-terra rubric call: ~2.3-2.8k input + ~500-900 output, measured live.
  #
  # NOT discounted for prompt caching, because measurement says there is none to
  # claim. The prompt is built stable-prefix-first (see scoring/rubric.py) and that
  # prefix is byte-identical across all 248 stored offers, but this provider only
  # cached a byte-identical *whole* prompt (2690/2693 tokens on a repeat). Two
  # offers sharing a 1302-token prefix cached 0, even 90s apart. Real scoring sends
  # a different offer every call, so in practice nothing caches today.
  cost_per_offer_usd: 0.011
