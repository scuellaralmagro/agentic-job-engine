# Weights must sum to 1.0 — validated at load.
weights:
  skills: 0.5
  seniority: 0.2
  domain: 0.2
  language: 0.1

prefilter:
  # Conservative default. Replace with a value taken from
  # `uv run python -m scripts.calibrate_threshold` once you have real offers.
  min_similarity: 0.30
  top_k: 8
  chunk_chars: 800

queue:
  threshold: 60

estimate:
  # gpt-5.6-terra rubric call. Measured over the 248 stored offers: ~1970 input
  # (mean) + ~500 output. Of that input, a 1302-token prefix — system + the whole
  # profile — is identical on every call and served from the prompt cache, so ~65%
  # of input bills at the cached rate. This figure is deliberately NOT discounted
  # for that: it stays a conservative ceiling, and the first call of any run is a
  # genuine cache miss.
  cost_per_offer_usd: 0.011
