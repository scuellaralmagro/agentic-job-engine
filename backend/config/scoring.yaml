# Weights must sum to 1.0 — validated at load.
weights:
  skills: 0.5
  seniority: 0.2
  domain: 0.2
  language: 0.1

prefilter:
  # Conservative default. Replace with a value taken from
  # `uv run python -m scripts.calibrate_threshold` once you have real offers.
  min_similarity: 0.30
  top_k: 8
  chunk_chars: 800

queue:
  threshold: 60

estimate:
  # gpt-5.6-terra rubric call: ~2.3-2.8k input + ~500-900 output, measured live.
  #
  # NOT discounted for prompt caching, and no prompt is shaped to earn it, because
  # measurement says there is nothing to earn. This provider cached a byte-identical
  # *whole* prompt (2690/2693 tokens on a repeat) but cached 0 for two offers sharing
  # a 1302-token system+profile prefix, even 90s apart. Real scoring sends a different
  # offer every call, so an exact whole-prompt match never happens. Revisit this only
  # if prefix caching is switched on (TODO.md, "Prompt caching is not actually on").
  cost_per_offer_usd: 0.011
